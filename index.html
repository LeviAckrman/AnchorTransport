<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnchorTransport TMS - Indian Transport Management System</title>
    <meta name="description" content="Production-oriented Transport Management System for Indian transport companies managing fleet, trips, freight, driver advances, settlements, GST invoices, and compliance." />
    <meta property="og:title" content="AnchorTransport TMS - Indian Transport Management System" />
    <meta property="og:description" content="Production-oriented Transport Management System for Indian transport companies managing fleet, trips, freight, driver advances, settlements, GST invoices, and compliance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully handle Vite dev HMR in iframe/cloud sandbox environments
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
              const mockWs = new EventTarget();
              mockWs.readyState = 1; // WebSocket.OPEN
              mockWs.OPEN = 1;
              mockWs.CLOSED = 3;
              mockWs.CLOSING = 2;
              mockWs.CONNECTING = 0;
              mockWs.send = function() {};
              mockWs.close = function() {};
              setTimeout(function() {
                mockWs.dispatchEvent(new Event('open'));
              }, 0);
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event && event.reason &&
            (String(event.reason.message || event.reason).includes('WebSocket') ||
             String(event.reason.stack || '').includes('@vite/client'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (
            String(event.message || '').includes('WebSocket') ||
            String(event.filename || '').includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
